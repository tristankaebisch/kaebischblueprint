<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <!-- Monogram Box Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#1E2038"/>
    <!-- Blueprint Grid Lines -->
    <line x1="16" y1="16" x2="64" y2="16" stroke="#2D304D" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="16" y1="40" x2="64" y2="40" stroke="#2D304D" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="16" y1="64" x2="64" y2="64" stroke="#2D304D" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="40" y1="16" x2="40" y2="64" stroke="#2D304D" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Backbone and Chevron Fusion -->
    <rect x="24" y="20" width="7" height="40" rx="3.5" fill="#FFFFFF"/>
    <path d="M54 22 L35 40 L54 58" fill="none" stroke="#535891" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="40" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Clean Primary Typography Only -->
  <text x="108" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#1E2038" letter-spacing="-0.03em">
    KAEBISCH <tspan fill="#535891">BLUEPRINT</tspan>
  </text>
</svg>
